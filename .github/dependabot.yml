version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
    schedule:
      interval: cron
      cronjob: '0 7 * * THU#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'

  - package-ecosystem: docker
    directories:
      - /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
